<style>
  :root {
    color-scheme: dark;
    --ground: #0f0e0c;
    --panel: rgba(22, 20, 16, 0.80);
    --ink: #f2ede4;
    --muted: #a89f91;

    --ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --gut: 16px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #9cc3dc; color: var(--ink); font-family: var(--ui); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--oak); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .panel { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; }
  .eyebrow { font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  #info { position: fixed; left: var(--gut); top: calc(var(--gut) + var(--safe-t)); padding: 10px 14px 11px;
    display: grid; gap: 4px; pointer-events: none; max-width: calc(100% - 150px); z-index: 5; }
  #info .da { font: 700 20px/1.15 var(--ui); letter-spacing: -.01em; }
  #info .en { font-size: 12.5px; color: var(--muted); min-height: 15px; }
  #info .co { font: 400 11.5px/1.2 var(--mono); color: var(--oak); font-variant-numeric: tabular-nums; min-height: 14px; }

  #quick { position: fixed; right: var(--gut); top: calc(var(--gut) + var(--safe-t)); display: grid; gap: 2px; padding: 4px; z-index: 6; }
  #quick button { font: 500 12px/1 var(--ui); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 9px 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; text-align: left; }
  #quick button i { font: 500 10px/1 var(--mono); font-style: normal; width: 16px; height: 16px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; }

  #quick #qTimeOut { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #timePop { position: fixed; right: calc(var(--gut) + 122px); top: calc(var(--gut) + var(--safe-t)); width: min(280px, calc(100vw - 160px)); padding: 12px 14px; display: grid; gap: 8px; z-index: 7; }
  #timePop input { width: 100%; accent-color: var(--oak); }
  #timePop .row { display: flex; justify-content: space-between; font: 400 11px/1 var(--mono); color: var(--muted); }

  #nav { position: fixed; right: var(--gut); bottom: calc(var(--gut) + var(--safe-b) + 18px); display: grid; gap: 2px; padding: 4px; z-index: 6; }
  #nav button { width: 40px; height: 40px; touch-action: none; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: 500 20px/1 var(--ui); cursor: pointer; display: grid; place-items: center; }
  #nav button:hover { background: var(--oak-dim); }

  #scale { position: fixed; left: var(--gut); bottom: calc(var(--gut) + var(--safe-b) + 18px); padding: 7px 10px 8px; z-index: 5; pointer-events: none; display: grid; gap: 5px; }
  #scale .bar { height: 5px; border: 1.5px solid var(--ink); border-top: 0; }

  #attrib { position: fixed; left: 0; right: 0; bottom: 0; padding: 3px 10px calc(3px + var(--safe-b)); font: 400 10px/1.3 var(--ui);
    color: rgba(20, 30, 40, .78); background: rgba(255, 255, 255, .55); z-index: 4; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lb.place { font: 700 15px/1.1 var(--ui); letter-spacing: .01em; color: #1f1b16; }
  .lb.town { font: 800 19px/1.1 var(--ui); letter-spacing: .04em; text-transform: uppercase; color: #1f1b16; }

  #loading .box { display: grid; gap: 10px; text-align: center; }

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const $ = (id) => document.getElementById(id);
const MEDIA = $('stage').dataset.media;
const LITE = /[?&]lite\b/.test(location.search);
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 560;
const QUALITY = LITE ? 0.5 : (MOBILE ? 0.65 : 1);

// ---------------- coordinates ----------------
// Blender/local frame: x east, y north, z up (metres).  three: (x, z, -y).
const b2t = (x, y, z) => new THREE.Vector3(x, z, -y);
let META, NX, NY, X0, Y0, CELL, X1, Y1, HGT;
function heightAt(x, y) {
  let fx = (x - X0) / CELL, fy = (y - Y0) / CELL;
  if (fx < 0 || fy < 0 || fx > NX - 1.001 || fy > NY - 1.001) return -30;
  const j = fx | 0, i = fy | 0, tx = fx - j, ty = fy - i, k = i * NX + j;
  return (HGT[k] * (1 - tx) + HGT[k + 1] * tx) * (1 - ty) + (HGT[k + NX] * (1 - tx) + HGT[k + NX + 1] * tx) * ty;
}
const R_EARTH = 6378137, E2 = 0.00669438;
function toLatLon(x, y) {   // small-area inverse of the local transverse Mercator (sub-metre over the island)
  const lat0 = META.lat0 * Math.PI / 180, s = Math.sin(lat0);
  const M = R_EARTH * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5), N = R_EARTH / Math.sqrt(1 - E2 * s * s);
  const lat = META.lat0 + (y / M) * 180 / Math.PI - (x * x * Math.tan(lat0) / (2 * M * N)) * 180 / Math.PI;
  const lon = META.lon0 + (x / (N * Math.cos(lat * Math.PI / 180))) * 180 / Math.PI;
  return [lat, lon];
}
function fromLatLon(lat, lon) {
  const lat0 = META.lat0 * Math.PI / 180, s = Math.sin(lat0);
  const M = R_EARTH * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5), N = R_EARTH / Math.sqrt(1 - E2 * s * s);
  const x = (lon - META.lon0) * Math.PI / 180 * N * Math.cos(lat * Math.PI / 180);
  const y = (lat - META.lat0) * Math.PI / 180 * M + x * x * Math.tan(lat0) / (2 * N);
  return [x, y];
}

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2) * (LITE ? 0.6 : 1));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.info.autoReset = false;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 2, 400000);
const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.screenSpacePanning = false;
controls.zoomToCursor = true;
controls.minDistance = 40; controls.maxDistance = 45000;
controls.maxPolarAngle = THREE.MathUtils.degToRad(80);
controls.zoomSpeed = 1.4;
controls.rotateSpeed = 0.6;
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

const STYLE = { cel: true, labels: true, trees: true, buildings: true, hour: 17 };
const FOG = new THREE.Color('#cfe2ec');
scene.fog = new THREE.FogExp2(FOG, 0.0000115);

// sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#4f9ad6') }, hor: { value: FOG.clone() }, sun: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color('#fff4dc') } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); gl_Position.z = gl_Position.w; }',
  fragmentShader: `uniform vec3 top, hor, sun, sunCol; varying vec3 vD;
    void main(){ float h = max(vD.y, 0.0); vec3 c = mix(hor, top, pow(h, 0.55));
      float s = max(dot(normalize(vD), normalize(sun)), 0.0); c += sunCol * (pow(s, 600.0) * 2.0 + pow(s, 12.0) * 0.18);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000000, 32, 16), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

const hemi = new THREE.HemisphereLight('#dbeeff', '#8a7456', 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d6', 3.0);
sun.castShadow = true;
const SHADOW_RES = LITE ? 1024 : (MOBILE ? 2048 : 4096);
sun.shadow.mapSize.set(SHADOW_RES, SHADOW_RES);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
let sunDir = new THREE.Vector3(0.5, 0.5, 0.5);

// toon ramp: three hard bands
const RAMP = (() => {
  const d = new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 215, 215, 215, 255, 255, 255, 255, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();

// ---------------- materials ----------------
const MATDEF = {
  Terrain: { color: '#ffffff' },
  RoadMain: { color: '#5f5c58', pull: [0.7, 0.0028] },
  RoadMinor: { color: '#7d776f', pull: [0.6, 0.0025] },
  Track: { color: '#a8906e', pull: [0.5, 0.0022] },
  Path: { color: '#bba47f', pull: [0.5, 0.0022] },
  Runway: { color: '#57595c', pull: [0.8, 0.0028] },
  Lava: { color: '#4d4743', pull: [0, 0.0006] },
  Plaster: { color: '#f0eadf', pull: [0, 0.0006] },
  Roof: { color: '#f7f4ee', pull: [0, 0.0006] },
  Glasshouse: { color: '#d3e0db', pull: [0, 0.0006] },
  Ruin: { color: '#5e564e', pull: [0, 0.0006] },
  Church: { color: '#f3e8d2', pull: [0, 0.0006] },
  Concrete: { color: '#bdb8ae' },
  Lake: { color: '#5cc2b2', pull: [0.3, 0.002], rough: 0.25 },
  Tree: { color: '#ffffff', vertexColors: true, pull: [0, 0.0006] },
};
const ALLMATS = [];
function makeMat(key, extra = {}) {
  const d = MATDEF[key];
  const pair = {};
  for (const cel of [true, false]) {
    const o = { color: new THREE.Color(d.color), vertexColors: !!d.vertexColors, ...extra };
    const m = cel ? new THREE.MeshToonMaterial({ ...o, gradientMap: RAMP }) : new THREE.MeshStandardMaterial({ ...o, roughness: d.rough ?? 0.92, metalness: 0 });
    if (d.pull) {
      m.userData.pull = d.pull;
      m.onBeforeCompile = (sh) => {
        sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
          { float l_ = length(mvPosition.xyz); mvPosition.xyz *= max(0.05, 1.0 - (${d.pull[0].toFixed(4)} + ${d.pull[1].toFixed(5)} * l_) / l_);
            gl_Position = projectionMatrix * mvPosition; }`);
      };
      m.customProgramCacheKey = () => 'pull' + d.pull.join('_');
    }
    pair[cel ? 'cel' : 'std'] = m;
  }
  ALLMATS.push(pair);
  return pair;
}
const MAT = {};
for (const k of Object.keys(MATDEF)) if (k !== 'Terrain') MAT[k] = makeMat(k);
function styleMeshes(root) {
  root.traverse((o) => { if (o.isMesh && o.userData.mats) o.material = o.userData.mats[STYLE.cel ? 'cel' : 'std']; });
}

// ---------------- loading ----------------
const loadBar = $('loadBar'), loadMsg = $('loadMsg');
let loaded = 0; const TOTAL = 6;
function step(msg) { loaded++; loadBar.style.width = (loaded / TOTAL * 100) + '%'; loadMsg.textContent = msg; }
async function bin(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
  let b = new Uint8Array(await r.arrayBuffer());
  if (b[0] === 0x1f && b[1] === 0x8b) {
    const ds = new DecompressionStream('gzip');
    b = new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer());
  }
  return b.buffer;
}
const texLoader = new THREE.TextureLoader();
const loadTex = (u) => new Promise((res, rej) => texLoader.load(u, res, undefined, rej));

// ---------------- terrain (chunked heightmap, 4 LODs) ----------------
const terrain = new THREE.Group(); scene.add(terrain);
const CH = 100, STEPS = [1, 2, 4, 8];
let LODH = [];   // box-filtered heights per level
const chunks = [];
let terrainMats;
function boxFilter(src, r) {
  if (r <= 1) return src;
  const out = new Float32Array(src.length), tmp = new Float32Array(src.length), h = Math.floor(r / 2);
  for (let i = 0; i < NY; i++) {
    for (let j = 0; j < NX; j++) {
      let s = 0, n = 0;
      for (let k = -h; k <= h; k++) { const jj = j + k; if (jj >= 0 && jj < NX) { s += src[i * NX + jj]; n++; } }
      tmp[i * NX + j] = s / n;
    }
  }
  for (let j = 0; j < NX; j++) {
    for (let i = 0; i < NY; i++) {
      let s = 0, n = 0;
      for (let k = -h; k <= h; k++) { const ii = i + k; if (ii >= 0 && ii < NY) { s += tmp[ii * NX + j]; n++; } }
      out[i * NX + j] = s / n;
    }
  }
  return out;
}
function chunkGeometry(c, L) {
  const st = STEPS[L], src = LODH[L];
  const ii = [], jj = [];
  for (let i = c.i0; i < c.i1; i += st) ii.push(i); ii.push(c.i1);
  for (let j = c.j0; j < c.j1; j += st) jj.push(j); jj.push(c.j1);
  const h = ii.length, w = jj.length;
  const nV = h * w, ring = 2 * (h + w) - 4;
  const pos = new Float32Array((nV + ring) * 3), uv = new Float32Array((nV + ring) * 2);
  const zat = (i, j) => (i === c.i0 || i === c.i1 || j === c.j0 || j === c.j1) ? HGT[i * NX + j] : src[i * NX + j];
  let p = 0;
  for (let a = 0; a < h; a++) for (let b = 0; b < w; b++) {
    const i = ii[a], j = jj[b], x = X0 + j * CELL, y = Y0 + i * CELL;
    pos[p * 3] = x; pos[p * 3 + 1] = zat(i, j); pos[p * 3 + 2] = -y;
    uv[p * 2] = (x - X0) / (X1 - X0); uv[p * 2 + 1] = (y - Y0) / (Y1 - Y0); p++;
  }
  const idx = [];
  for (let a = 0; a < h - 1; a++) for (let b = 0; b < w - 1; b++) {
    const v0 = a * w + b, v1 = v0 + 1, v2 = v0 + w + 1, v3 = v0 + w;
    if (pos[v0 * 3 + 1] < -1 && pos[v1 * 3 + 1] < -1 && pos[v2 * 3 + 1] < -1 && pos[v3 * 3 + 1] < -1) continue;  // open sea
    // three's -z is north: wind counter-clockwise seen from above
    idx.push(v0, v1, v2, v0, v2, v3);
  }
  // skirts
  const rv = [];
  for (let b = 0; b < w; b++) rv.push(b);
  for (let a = 1; a < h; a++) rv.push(a * w + w - 1);
  for (let b = w - 2; b >= 0; b--) rv.push((h - 1) * w + b);
  for (let a = h - 2; a > 0; a--) rv.push(a * w);
  for (let k = 0; k < rv.length; k++) {
    const s = rv[k], d = nV + k;
    pos[d * 3] = pos[s * 3]; pos[d * 3 + 1] = pos[s * 3 + 1] - 30; pos[d * 3 + 2] = pos[s * 3 + 2];
    uv[d * 2] = uv[s * 2]; uv[d * 2 + 1] = uv[s * 2 + 1];
  }
  for (let k = 0; k < rv.length; k++) {
    const a = rv[k], b = rv[(k + 1) % rv.length], A = nV + k, B = nV + (k + 1) % rv.length;
    if (pos[a * 3 + 1] < -1 && pos[b * 3 + 1] < -1) continue;
    idx.push(a, b, A, b, B, A);
  }
  if (!idx.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx.length > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));

const labelEls = [];
function buildLabels() {
  const host = $('labels');
  for (const l of META.labels) {
    const el = document.createElement('div');
    const kind = l.kind === 'place' && l.prio === 0 ? 'town' : l.kind;
    el.className = 'lb ' + kind;
    el.textContent = l.name;
    if (l.kind === 'peak' && l.ele) { const s = document.createElement('small'); s.textContent = Math.round(+l.ele) + ' m'; el.appendChild(s); }
    el.style.visibility = 'hidden';
    host.appendChild(el);
    labelEls.push({ l, el, p: b2t(l.x, l.y, l.z + (l.kind === 'peak' ? 4 : 10)), w: 0, h: 0, shown: false });
  }
  requestAnimationFrame(() => { for (const L of labelEls) { L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; } });
  labelEls.sort((a, b) => a.l.prio - b.l.prio);
}
const _v = new THREE.Vector3();
const _ray = new THREE.Raycaster();
function updateLabels() {
  const dist = camera.position.distanceTo(controls.target);
  const maxPrio = dist > 16000 ? 1 : dist > 9000 ? 2 : dist > 5000 ? 3 : dist > 2500 ? 5 : 9;
  const W = innerWidth, H = innerHeight, placed = [];
  for (const L of labelEls) {
    let show = STYLE.labels && L.l.prio <= maxPrio;
    let sx = 0, sy = 0;
    if (show) {
      _v.copy(L.p).project(camera);
      if (_v.z > 1 || _v.x < -1.1 || _v.x > 1.1 || _v.y < -1.1 || _v.y > 1.1) show = false;
      else {
        sx = (_v.x * 0.5 + 0.5) * W; sy = (-_v.y * 0.5 + 0.5) * H;
        const r = { x0: sx - L.w / 2 - 4, x1: sx + L.w / 2 + 4, y0: sy - L.h - 2, y1: sy + 2 };
        for (const q of placed) if (r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0) { show = false; break; }
        if (show) {

          if (occluded(L.p)) show = false; else placed.push(r);
        }
      }
    }
    if (show) L.el.style.transform = `translate(${(sx - L.w / 2).toFixed(1)}px, ${(sy - L.h).toFixed(1)}px)`;
    if (show !== L.shown) { L.el.style.visibility = show ? 'visible' : 'hidden'; L.shown = show; }
  }

}

// ---- road names: drawn along the road (rotated, kept upright), like a map; appear as you zoom in ----
const ROADS = [];          // {n, p: Vector3, d: Vector3 (unit dir), t}
const roadPool = [];       // reusable DOM labels
const ROAD_MAX = { 0: 4200, 1: 1700, 2: 1000 };   // camera-to-target distance at which each tier appears
function buildRoadLabels() {
  for (const [n, x, y, z, a, t] of META.roadLabels || []) ROADS.push({ n, t, p: b2t(x, y, z), d: b2t(Math.cos(a), Math.sin(a), 0) });
}
const _a = new THREE.Vector3(), _b = new THREE.Vector3();
function roadEl(i) {
  while (roadPool.length <= i) {
    const el = document.createElement('div'); el.className = 'lb road'; el.style.visibility = 'hidden';
    $('labels').appendChild(el); roadPool.push({ el, text: '', on: false });
  }

}
function updateRoadLabels(placed, dist) {
  let used = 0;
  if (STYLE.labels && dist < ROAD_MAX[0]) {
    const W = innerWidth, H = innerHeight, cp = camera.position, tg = controls.target;
    const reach = Math.max(600, dist * 1.6);
    const cand = [];
    for (const R of ROADS) {
      if (dist > ROAD_MAX[R.t]) continue;
      const dt = Math.hypot(R.p.x - tg.x, R.p.z - tg.z);
      if (dt > reach) continue;

      if (_a.z > 1 || _a.x < -1.05 || _a.x > 1.05 || _a.y < -1.05 || _a.y > 1.05) continue;

      const w = slot.w, h = slot.h, c = Math.abs(Math.cos(ang)), s_ = Math.abs(Math.sin(ang));

      let free = true;
      for (const q of placed) if (r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0) { free = false; break; }
      if (!free || occluded(R.p)) continue;
      placed.push(r);
      (seenName.get(R.n) || seenName.set(R.n, []).get(R.n)).push([sx, sy]);
      slot.el.style.transform = `translate(${(sx - w / 2).toFixed(1)}px, ${(sy - h / 2).toFixed(1)}px) rotate(${ang.toFixed(3)}rad)`;
      slot.el.className = 'lb road' + (R.t === 0 ? ' main' : R.t === 2 ? ' track' : '');

  for (let i = used; i < roadPool.length; i++) if (roadPool[i].on) { roadPool[i].el.style.visibility = 'hidden'; roadPool[i].on = false; roadPool[i].text = roadPool[i].el.textContent; }
}
function occluded(p) {
  const c = camera.position, n = 24;

    if (heightAt(x, -z) > y + 2) return true;

// ---------------- hover readout ----------------
let hoverPending = null;
renderer.domElement.addEventListener('pointermove', (e) => { hoverPending = e; });
function updateHover() {
  if (!hoverPending) return; const e = hoverPending; hoverPending = null;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  const hit = pickGround(ndc);
  if (!hit) { $('infoCo').textContent = ''; return; }
  const x = hit.x, y = -hit.z, z = heightAt(x, y);
  const [lat, lon] = toLatLon(x, y);
  $('infoCo').textContent = z > 0.5 ? `${lat.toFixed(5)}°N ${lon.toFixed(5)}°E · ${Math.round(z)} m` : `${lat.toFixed(5)}°N ${lon.toFixed(5)}°E · sea`;
  // nearest named thing within 400 m
  let best = null, bd = 400;
  for (const L of labelEls) { const d = Math.hypot(L.l.x - x, L.l.y - y); if (d < bd && L.l.kind !== 'cape') { bd = d; best = L.l; } }
  $('infoName').textContent = best ? best.name : 'Figlia del vento · 83 km² · 836 m';
}
function pickGround(ndc) {
  _ray.setFromCamera(ndc, camera);
  const vis = chunks.filter((c) => c.mesh.visible).map((c) => c.mesh);
  const h = _ray.intersectObjects(vis, false)[0];
  if (h) return h.point;
  // sea plane
  const o = _ray.ray.origin, d = _ray.ray.direction;

// ---------------- scale bar ----------------
function updateScale() {
  const dist = camera.position.distanceTo(controls.target);
  const mpp = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / innerHeight;
  const target = mpp * 90;
  const nice = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
  let v = nice[0]; for (const n of nice) if (n <= target) v = n;
  $('scaleBar').style.width = Math.round(v / mpp) + 'px';
  $('scaleLab').textContent = v >= 1000 ? (v / 1000) + ' km' : v + ' m';
  const az = controls.getAzimuthalAngle();
  $('compassNeedle').setAttribute('transform', `rotate(${THREE.MathUtils.radToDeg(az).toFixed(1)})`);
}

// ---------------- view helpers ----------------
let anim = null;
function setView({ x, y, dist, heading = 0, tilt = 50 }, dur = 0) {
  const z = Math.max(0, heightAt(x, y));
  const tgt = b2t(x, y, z);
  const ph = THREE.MathUtils.degToRad(tilt), th = THREE.MathUtils.degToRad(heading);
  // heading = compass direction the camera looks toward
  const off = new THREE.Vector3(-Math.sin(th) * Math.sin(ph), Math.cos(ph), Math.cos(th) * Math.sin(ph)).multiplyScalar(dist);
  const pos = tgt.clone().add(off);
  if (!dur) { controls.target.copy(tgt); camera.position.copy(pos); controls.update(); return; }
  anim = { t0: performance.now(), dur, a: { t: controls.target.clone(), p: camera.position.clone() }, b: { t: tgt, p: pos } };
}
function getView() {
  const off = camera.position.clone().sub(controls.target), dist = off.length();
  const tilt = THREE.MathUtils.radToDeg(Math.acos(off.y / dist));
  const heading = THREE.MathUtils.radToDeg(Math.atan2(-off.x, off.z));

}
function orbitTo({ tilt, heading }, dur = 700) {
  const v = getView();
  const b = { x: v.x, y: v.y, dist: v.dist, tilt: tilt ?? v.tilt, heading: heading ?? v.heading };
  const ph = THREE.MathUtils.degToRad(b.tilt), th = THREE.MathUtils.degToRad(b.heading);
  const tgt = controls.target.clone();
  const pos = tgt.clone().add(new THREE.Vector3(-Math.sin(th) * Math.sin(ph), Math.cos(ph), Math.cos(th) * Math.sin(ph)).multiplyScalar(b.dist));

}
function zoomBy(f) {
  const off = camera.position.clone().sub(controls.target);
  const d = THREE.MathUtils.clamp(off.length() * f, controls.minDistance, controls.maxDistance);
  anim = { t0: performance.now(), dur: 350, a: { t: controls.target.clone(), p: camera.position.clone() }, b: { t: controls.target.clone(), p: controls.target.clone().add(off.setLength(d)) } };
}

// keep the camera above the ground and the near plane sensible
function clampCamera() {
  const cp = camera.position, g = heightAt(cp.x, -cp.z);
  const minH = Math.max(g, 0) + 12;
  if (cp.y < minH) cp.y = minH;
  const tg = controls.target; const gt = Math.max(0, heightAt(tg.x, -tg.z));
  tg.y += (gt - tg.y) * 0.25;          // target glides over the terrain
  const above = cp.y - Math.max(g, 0);

// URL hash: #lat,lon,dist,heading,tilt
function writeHash() {
  const v = getView(); const [lat, lon] = toLatLon(v.x, v.y);
  history.replaceState(null, '', `#${lat.toFixed(5)},${lon.toFixed(5)},${Math.round(v.dist)},${Math.round(v.heading)},${Math.round(v.tilt)}`);
}
function readHash() {
  const m = location.hash.slice(1).split(',').map(Number);
  if (m.length >= 3 && m.every(Number.isFinite)) { const [x, y] = fromLatLon(m[0], m[1]); return { x, y, dist: m[2], heading: m[3] || 0, tilt: m[4] ?? 50 }; }
  return null;
}

// ---------------- UI wiring ----------------
function setPressed(id, on) { $(id).setAttribute('aria-pressed', on ? 'true' : 'false'); }
let photoTex = null, photoLoading = false;
function setStyle(cel) {
  STYLE.cel = cel;
  if (!cel && !photoTex && !photoLoading && terrainMats) {
    photoLoading = true;
    loadTex(MEDIA + 'terrain_photo.webp').then((t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      photoTex = t; terrainMats.std.map = t; terrainMats.std.needsUpdate = true; kick(); });
  }
  styleMeshes(scene);
  if (sea) sea.material.uniforms.cel.value = cel ? 1 : 0;
  shadowDirty = true; kick();
}
$('qLabels').onclick = () => { STYLE.labels = !STYLE.labels; setPressed('qLabels', STYLE.labels); kick(); };
$('qTime').onclick = () => { const p = $('timePop'); p.hidden = !p.hidden; setPressed('qTime', !p.hidden); };
$('sunrange').addEventListener('input', (e) => { updateSun(+e.target.value); kick(); });
$('zin').onclick = () => zoomBy(0.5);
$('zout').onclick = () => zoomBy(2);
// rotation: right-drag or shift/ctrl/cmd + drag on the map (OrbitControls), two-finger drag on touch,
// the ⟲ ⟳ buttons (hold to keep turning), Q/E and R/F keys, or dragging the compass
function nudge(dh, dt) {
  const v = getView();
  setView({ ...v, heading: v.heading + dh, tilt: THREE.MathUtils.clamp(v.tilt + dt, 0, 80) }); kick(); writeHash();
}
function holdRepeat(id, fn) {
  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; };
  $(id).addEventListener('pointerdown', (e) => { e.preventDefault(); fn(); stop(); timer = setInterval(fn, 40); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) $(id).addEventListener(ev, stop);
}
holdRepeat('rotL', () => nudge(-1.5, 0));
holdRepeat('rotR', () => nudge(1.5, 0));
{
  const nb = $('north'); let drag = null, moved = false;
  nb.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; moved = false; nb.setPointerCapture(e.pointerId); });
  nb.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (moved) { nudge(dx * 0.6, -dy * 0.4); drag = { x: e.clientX, y: e.clientY }; }
  });
  nb.addEventListener('pointerup', () => { if (!moved) orbitTo({ heading: 0 }); drag = null; });
}
// the map itself: right-drag rotates; so does shift/ctrl/cmd + left-drag (OrbitControls), and alt + left-drag
renderer.domElement.addEventListener('pointerdown', (e) => {
  controls.mouseButtons.LEFT = e.altKey ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
}, { capture: true });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'l') $('qLabels').click(); else if (k === 'h') $('qTime').click();
  else if (k === 'n') $('north').click(); else if (k === '+' || k === '=') zoomBy(0.5); else if (k === '-') zoomBy(2);
  else if (k === 'q' || k === 'arrowleft' && e.shiftKey) nudge(-15, 0); else if (k === 'e' || k === 'arrowright' && e.shiftKey) nudge(15, 0);
  else if (k === 'r' || k === 'arrowup' && e.shiftKey) nudge(0, -8); else if (k === 'f' || k === 'arrowdown' && e.shiftKey) nudge(0, 8);
});
renderer.domElement.addEventListener('dblclick', (e) => {
  const p = pickGround(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1));
  if (!p) return;
  const off = camera.position.clone().sub(controls.target).multiplyScalar(0.45);
  anim = { t0: performance.now(), dur: 500, a: { t: controls.target.clone(), p: camera.position.clone() }, b: { t: p.clone(), p: p.clone().add(off) } };
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); resizePost(); kick();
});
let lastInteract = performance.now();
function kick() { lastInteract = performance.now(); }
controls.addEventListener('change', kick);
controls.addEventListener('end', () => writeHash());

// ---------------- render loop ----------------
const clock = new THREE.Clock();
let frame = 0, ftimes = [];
function render(now) {
  requestAnimationFrame(render);
  const idle = now - lastInteract > 1500;
  frame++;
  if (idle && frame % 4) return;          // ~15 fps when nothing moves (the sea still breathes)
  const t0 = performance.now();
  renderer.info.reset();
  stepAnim(now);
  controls.update();
  clampCamera();
  updateTerrainLOD();
  updateCulling();
  if (sea) sea.material.uniforms.time.value = clock.getElapsedTime();
  sky.position.copy(camera.position);
  if (sea) { sea.position.x = camera.position.x; sea.position.z = camera.position.z; }   // edge always ~2000 km away, fully fogged
  if (fitShadow() || shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  if (STYLE.cel && post.color) {
    // pass 1: normals + depth
    const bg = scene.background; scene.overrideMaterial = post.nmat;
    sky.visible = false; if (sea) sea.visible = true;
    renderer.setRenderTarget(post.nrm); renderer.setClearColor(0x8080ff, 1); renderer.clear(); renderer.render(scene, camera);
    scene.overrideMaterial = null; sky.visible = true;
    // pass 2: colour
    renderer.setRenderTarget(post.color); renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    post.mat.uniforms.near.value = camera.near; post.mat.uniforms.far.value = camera.far;
    renderer.render(post.scene, post.cam);
  } else {
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  }
  updateLabels();
  updateHover();
  updateScale();
  ftimes.push(performance.now() - t0); if (ftimes.length > 60) ftimes.shift();
}

// ---------------- boot ----------------
async function boot() {
  try {
    META = await (await fetch(MEDIA + 'meta.json')).json(); step('heights');
    ({ x0: X0, y0: Y0, cell: CELL, nx: NX, ny: NY } = META);
    X1 = X0 + (NX - 1) * CELL; Y1 = Y0 + (NY - 1) * CELL;
    const hb = new Uint16Array(await bin(MEDIA + 'height.bin'));
    HGT = new Float32Array(hb.length); for (let k = 0; k < hb.length; k++) HGT[k] = hb[k] / 50 - 50;
    step('colours');
    const [colorTex, coastTex] = await Promise.all([loadTex(MEDIA + 'terrain.webp'), loadTex(MEDIA + 'coast.png')]);
    buildTerrain(colorTex); buildSea(coastTex); step('roads & buildings');
    const gl = new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder);
    const gltf = await new Promise((res, rej) => gl.load(MEDIA + 'island.glb', res, undefined, rej));
    addGLB(gltf); step('trees');
    buildInstances(await bin(MEDIA + 'instances.bin')); step('names');
    buildLabels(); buildRoadLabels();
    setupPost();
    updateSun(STYLE.hour);
    setView(readHash() || { x: -600, y: -300, dist: 21000, heading: 20, tilt: 48 });
    styleMeshes(scene);
    step('ready');
    $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 600);
    window.__ready = true;
    requestAnimationFrame(render);
  } catch (err) {
    console.error(err); loadMsg.textContent = 'Could not load: ' + err.message;
  }
}
boot();

window.__pan = { THREE, scene, camera, controls, renderer, chunks, culled, setView, getView, orbitTo, updateSun, setStyle, heightAt, toLatLon, fromLatLon, b2t, STYLE,
  perf: () => ({ ms: ftimes.reduce((a, b) => a + b, 0) / Math.max(1, ftimes.length), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: renderer.getPixelRatio() }) };
