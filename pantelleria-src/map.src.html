<style>
  :root {
    color-scheme: dark;
    --ground: #0f0e0c;
    --panel: rgba(22, 20, 16, 0.80);
    --ink: #f2ede4;
    --muted: #a89f91;
    --line: rgba(242, 237, 228, 0.14);
    --oak: #cf9152;
    --oak-dim: rgba(207, 145, 82, 0.28);
    --ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --gut: 16px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #9cc3dc; color: var(--ink); font-family: var(--ui); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--oak); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .panel { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; }
  .eyebrow { font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  #info { position: fixed; left: var(--gut); top: calc(var(--gut) + var(--safe-t)); padding: 10px 14px 11px;
    display: grid; gap: 4px; pointer-events: none; max-width: calc(100% - 150px); z-index: 5; }
  #info .da { font: 700 20px/1.15 var(--ui); letter-spacing: -.01em; }
  #info .en { font-size: 12.5px; color: var(--muted); min-height: 15px; }
  #info .co { font: 400 11.5px/1.2 var(--mono); color: var(--oak); font-variant-numeric: tabular-nums; min-height: 14px; }

  #modes { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--gut) + var(--safe-t)); display: flex; gap: 2px; padding: 4px; z-index: 6; }
  #modes button { font: 500 12.5px/1 var(--ui); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 8px 11px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  #modes button i { font: 500 10px/1 var(--mono); font-style: normal; width: 15px; height: 15px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; }
  #modes button[aria-pressed="true"] { color: var(--ink); background: var(--oak-dim); }
  #modes button[aria-pressed="true"] i { border-color: var(--oak); color: var(--oak); }
  #hud { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--gut) + var(--safe-b) + 18px); padding: 10px 14px; z-index: 6; display: grid; gap: 7px; justify-items: center; max-width: min(760px, calc(100vw - 2 * var(--gut))); }
  #hudMain { display: flex; align-items: baseline; gap: 6px; font: 400 12px/1 var(--mono); color: var(--muted); flex-wrap: wrap; justify-content: center; }
  #hudMain b { font: 500 22px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  #hudMain .sep { width: 1px; height: 14px; background: var(--line); margin: 0 5px; align-self: center; }
  #hudMain .thr { width: 54px; height: 6px; border: 1px solid var(--line); border-radius: 3px; align-self: center; overflow: hidden; }
  #hudMain .thr i { display: block; height: 100%; background: var(--oak); }
  #hudMain .thr.brk i { background: #e0573a; } #hudMain .thr.rpm { width: 70px; } #hudMain b.gear { font-size: 18px; min-width: 14px; text-align: center; }
  #hudMain .warn { color: #ff9c6e; font-weight: 500; }
  #hudKeys { font: 400 11px/1.6 var(--ui); color: var(--muted); text-align: center; }
  #hudKeys b { font: 500 10px/1 var(--mono); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; margin: 0 2px 0 6px; }
  #hud .hb { display: flex; gap: 6px; }
  #hud .hb button { font: 500 11.5px/1 var(--ui); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
  #hud .hb button:hover { background: var(--oak-dim); }
  #vmsg { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); font: 600 15px/1.2 var(--ui); color: #fff; text-shadow: 0 1px 3px #0009, 0 0 12px #0006; z-index: 6; pointer-events: none; text-align: center; }
  body.vehicle #nav, body.vehicle #scale { display: none; }
  /* touch: on-screen stick, pedals and throttle; HUD moves to the top */
  #touch .tpad { position: fixed; left: calc(var(--gut) + 6px); bottom: calc(var(--gut) + var(--safe-b) + 14px); width: 136px; height: 136px; border-radius: 50%;
    background: rgba(20, 18, 15, 0.35); border: 1.5px solid rgba(255, 255, 255, 0.35); touch-action: none; z-index: 7; }
  #touch .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; background: rgba(255, 255, 255, 0.78); box-shadow: 0 2px 8px #0006; pointer-events: none; }
  #touch .tside { position: fixed; right: calc(var(--gut) + 6px); bottom: calc(var(--gut) + var(--safe-b) + 14px); display: flex; gap: 10px; align-items: flex-end; z-index: 7; }
  #touch .tside[hidden] { display: none; }
  #touch .tbtn { width: 74px; height: 96px; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.4); background: rgba(20, 18, 15, 0.45); color: #fff;
    font: 600 13px/1.1 var(--ui); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #touch .tbtn.gas { height: 136px; background: rgba(70, 120, 60, 0.5); }
  #touch .tbtn.sm { width: 66px; height: 54px; font-size: 11.5px; }
  #touch .tbtn.on { background: rgba(207, 145, 82, 0.8); }
  #touch .tcol { display: grid; gap: 8px; }
  #touch .tthr { width: 66px; height: 156px; border-radius: 14px; border: 1.5px solid rgba(255, 255, 255, 0.4); background: rgba(20, 18, 15, 0.45); position: relative; overflow: hidden; touch-action: none; }
  #touch .tthr .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(207, 145, 82, 0.75); }
  #touch .tthr span { position: absolute; top: 7px; width: 100%; text-align: center; font: 600 10.5px/1 var(--ui); color: #fff; pointer-events: none; }
  body.touch #hudKeys { display: none; }
  body.touch.vehicle #info { display: none; }
  body.touch.vehicle #modes { top: calc(var(--gut) + var(--safe-t)); bottom: auto; left: 50%; transform: translateX(-50%); }
  body.touch.vehicle #hud { top: calc(var(--gut) + var(--safe-t) + 50px); bottom: auto; padding: 7px 10px; gap: 6px; }
  body.touch #hudMain b { font-size: 18px; }
  body.touch #hud .hb button { padding: 8px 12px; }
  canvas { touch-action: none; }
  @media (max-width: 640px) { #modes { top: auto; bottom: calc(var(--gut) + var(--safe-b) + 18px); left: var(--gut); transform: none; } body.vehicle #modes { top: calc(var(--gut) + var(--safe-t) + 50px); bottom: auto; } }
  #quick { position: fixed; right: var(--gut); top: calc(var(--gut) + var(--safe-t)); display: grid; gap: 2px; padding: 4px; z-index: 6; }
  #quick button { font: 500 12px/1 var(--ui); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 9px 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; text-align: left; }
  #quick button i { font: 500 10px/1 var(--mono); font-style: normal; width: 16px; height: 16px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; }
  #quick button[aria-pressed="true"] { color: var(--ink); background: var(--oak-dim); }
  #quick button[aria-pressed="true"] i { border-color: var(--oak); color: var(--oak); }
  #quick #qTimeOut { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #timePop { position: fixed; right: calc(var(--gut) + 122px); top: calc(var(--gut) + var(--safe-t)); width: min(280px, calc(100vw - 160px)); padding: 12px 14px; display: grid; gap: 8px; z-index: 7; }
  #timePop input { width: 100%; accent-color: var(--oak); }
  #timePop .row { display: flex; justify-content: space-between; font: 400 11px/1 var(--mono); color: var(--muted); }

  #nav { position: fixed; right: var(--gut); bottom: calc(var(--gut) + var(--safe-b) + 18px); display: grid; gap: 2px; padding: 4px; z-index: 6; }
  #nav button { width: 40px; height: 40px; touch-action: none; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: 500 20px/1 var(--ui); cursor: pointer; display: grid; place-items: center; }
  #nav button:hover { background: var(--oak-dim); }
  #compassNeedle { transition: none; }

  #scale { position: fixed; left: var(--gut); bottom: calc(var(--gut) + var(--safe-b) + 18px); padding: 7px 10px 8px; z-index: 5; pointer-events: none; display: grid; gap: 5px; }
  #scale .bar { height: 5px; border: 1.5px solid var(--ink); border-top: 0; }
  #scale .lab { font: 500 11px/1 var(--mono); color: var(--ink); }
  #attrib { position: fixed; left: 0; right: 0; bottom: 0; padding: 3px 10px calc(3px + var(--safe-b)); font: 400 10px/1.3 var(--ui);
    color: rgba(20, 30, 40, .78); background: rgba(255, 255, 255, .55); z-index: 4; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #attrib a { color: inherit; }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px/1.1 var(--ui); color: #2b2620;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; will-change: transform; }
  .lb.place { font: 700 15px/1.1 var(--ui); letter-spacing: .01em; color: #1f1b16; }
  .lb.town { font: 800 19px/1.1 var(--ui); letter-spacing: .04em; text-transform: uppercase; color: #1f1b16; }
  .lb.locality { font: 500 11.5px/1.1 var(--ui); color: #3c352b; }
  .lb.peak { font: 600 11.5px/1.1 var(--ui); color: #4a3220; }
  .lb.peak::before { content: "▲ "; font-size: 9px; color: #6b4a2e; }
  .lb.peak small { font: 400 10px/1 var(--mono); color: #7a5a3c; margin-left: 4px; }
  .lb.water, .lb.bay { font: italic 500 11.5px/1.1 var(--ui); color: #12557a; text-shadow: 0 0 3px #e8f6ff, 0 0 3px #e8f6ff; }
  .lb.cape { font: italic 400 10.5px/1.1 var(--ui); color: #24425a; text-shadow: 0 0 3px #e8f6ff, 0 0 2px #e8f6ff; }
  .lb.poi { font: 500 11px/1.1 var(--ui); color: #5a3a1a; }
  .lb.poi::before { content: "● "; font-size: 8px; color: var(--oak); }
  .lb[class*="town-"] { font: 500 10.5px/1.1 var(--ui); color: #3a2a1a; text-shadow: 0 0 3px #fff8ec, 0 0 2px #fff8ec; }
  .lb.town-landmark { font: 700 13px/1.1 var(--ui); color: #2a1d12; letter-spacing: .02em; }
  .lb.town-landmark::before { content: "◆ "; font-size: 9px; color: #8a5a2e; }
  .lb.town-port, .lb.town-quay { font: italic 600 11px/1.1 var(--ui); color: #12557a; text-shadow: 0 0 3px #e8f6ff, 0 0 2px #e8f6ff; }
  .lb.town-square { font: 600 11.5px/1.1 var(--ui); color: #4a3220; }
  .lb.town-food::before { content: "🍴 "; font-size: 9px; }
  .lb.town-bar::before { content: "☕ "; font-size: 9px; }
  .lb.town-hotel::before { content: "■ "; font-size: 8px; color: #2d5a8a; }
  .lb.town-shop::before { content: "● "; font-size: 7px; color: #8a6a4a; }
  .lb.town-civic::before { content: "▣ "; font-size: 8px; color: #6a4a2e; }
  .lb.road { font: 500 11px/1 var(--ui); color: #4a4540; letter-spacing: .01em; transform-origin: 50% 50%;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }
  .lb.road.main { font-weight: 600; color: #3a342d; }
  .lb.road.track { font: italic 400 10.5px/1 var(--ui); color: #6a5a45; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0f0e0c; z-index: 20; transition: opacity .5s; }
  #loading .box { display: grid; gap: 10px; text-align: center; }
  #loading .t { font: 700 26px/1 var(--ui); color: var(--ink); }
  #loading .p { font: 400 12px/1 var(--mono); color: var(--muted); }
  #loading .bar { width: 220px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #loading .bar div { height: 100%; width: 0; background: var(--oak); transition: width .2s; }

  @media (max-width: 560px) {
    :root { --gut: 10px; }
    #quick button span { display: none; }
    #timePop { right: calc(var(--gut) + 52px); }
    #info .da { font-size: 17px; }
  }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const $ = (id) => document.getElementById(id);
const MEDIA = $('stage').dataset.media;
const LITE = /[?&]lite\b/.test(location.search);
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 560;
const QUALITY = LITE ? 0.5 : (MOBILE ? 0.65 : 1);

// ---------------- coordinates ----------------
// Blender/local frame: x east, y north, z up (metres).  three: (x, z, -y).
const b2t = (x, y, z) => new THREE.Vector3(x, z, -y);
let META, NX, NY, X0, Y0, CELL, X1, Y1, HGT;
function heightAt(x, y) {
  let fx = (x - X0) / CELL, fy = (y - Y0) / CELL;
  if (fx < 0 || fy < 0 || fx > NX - 1.001 || fy > NY - 1.001) return -30;
  const j = fx | 0, i = fy | 0, tx = fx - j, ty = fy - i, k = i * NX + j;
  return (HGT[k] * (1 - tx) + HGT[k + 1] * tx) * (1 - ty) + (HGT[k + NX] * (1 - tx) + HGT[k + NX + 1] * tx) * ty;
}
// Catmull-Rom bicubic: smooth slopes for the 5 m near-camera terrain
function heightCubic(x, y) {
  const fx = (x - X0) / CELL, fy = (y - Y0) / CELL;
  if (fx < 1 || fy < 1 || fx > NX - 3 || fy > NY - 3) return heightAt(x, y);
  const j = Math.floor(fx), i = Math.floor(fy), tx = fx - j, ty = fy - i;
  const cr = (p0, p1, p2, p3, t) => p1 + 0.5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
  const row = (r) => { const k = r * NX + j; return cr(HGT[k - 1], HGT[k], HGT[k + 1], HGT[k + 2], tx); };
  const h = cr(row(i - 1), row(i), row(i + 1), row(i + 2), ty);
  const lo = Math.min(HGT[i * NX + j], HGT[i * NX + j + 1], HGT[(i + 1) * NX + j], HGT[(i + 1) * NX + j + 1]);
  const hi = Math.max(HGT[i * NX + j], HGT[i * NX + j + 1], HGT[(i + 1) * NX + j], HGT[(i + 1) * NX + j + 1]);
  return Math.min(Math.max(h, lo - 1.5), hi + 1.5);    // no wild overshoot at cliffs
}
const R_EARTH = 6378137, E2 = 0.00669438;
function toLatLon(x, y) {   // small-area inverse of the local transverse Mercator (sub-metre over the island)
  const lat0 = META.lat0 * Math.PI / 180, s = Math.sin(lat0);
  const M = R_EARTH * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5), N = R_EARTH / Math.sqrt(1 - E2 * s * s);
  const lat = META.lat0 + (y / M) * 180 / Math.PI - (x * x * Math.tan(lat0) / (2 * M * N)) * 180 / Math.PI;
  const lon = META.lon0 + (x / (N * Math.cos(lat * Math.PI / 180))) * 180 / Math.PI;
  return [lat, lon];
}
function fromLatLon(lat, lon) {
  const lat0 = META.lat0 * Math.PI / 180, s = Math.sin(lat0);
  const M = R_EARTH * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5), N = R_EARTH / Math.sqrt(1 - E2 * s * s);
  const x = (lon - META.lon0) * Math.PI / 180 * N * Math.cos(lat * Math.PI / 180);
  const y = (lat - META.lat0) * Math.PI / 180 * M + x * x * Math.tan(lat0) / (2 * N);
  return [x, y];
}

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2) * (LITE ? 0.6 : 1));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.info.autoReset = false;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 2, 400000);
const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.screenSpacePanning = false;
controls.zoomToCursor = true;
controls.minDistance = 40; controls.maxDistance = 45000;
controls.maxPolarAngle = THREE.MathUtils.degToRad(80);
controls.zoomSpeed = 1.4;
controls.rotateSpeed = 0.6;
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

const STYLE = { cel: true, labels: true, trees: true, buildings: true, hour: 17 };
const FOG = new THREE.Color('#cfe2ec');
scene.fog = new THREE.FogExp2(FOG, 0.0000115);

}

// ---------------- render loop ----------------
const clock = new THREE.Clock();
let frame = 0, ftimes = [];
function render(now) {
  requestAnimationFrame(render);

  if (idle && frame % 4) return;          // ~15 fps when nothing moves (the sea still breathes)
  const t0 = performance.now();
  renderer.info.reset();
  const dtk = Math.min(0.25, (now - (render.last || now)) / 1000); render.last = now;
  if (VEH.mode === 'map') { keyMove(dtk); stepAnim(now); controls.update(); clampCamera(); }
  else { updateVehicle(dtk); kick(); }
  updateTerrainLOD();
  updateCulling();
  updateDetail();
  if (sea) sea.material.uniforms.time.value = clock.getElapsedTime();
  sky.position.copy(camera.position);
  if (sea) { sea.position.x = camera.position.x; sea.position.z = camera.position.z; }   // edge always ~2000 km away, fully fogged
  if (fitShadow() || shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }

    // pass 1: normals + depth
    const bg = scene.background; scene.overrideMaterial = post.nmat;

    renderer.setRenderTarget(post.nrm); renderer.setClearColor(0x8080ff, 1); renderer.clear(); renderer.render(scene, camera);
    scene.overrideMaterial = null; sky.visible = true;
    // pass 2: colour
    renderer.setRenderTarget(post.color); renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    post.mat.uniforms.near.value = camera.near; post.mat.uniforms.far.value = camera.far; post.mat.uniforms.lapMin.value = VEH.mode === 'car' ? 0.03 : 0.012;
    renderer.render(post.scene, post.cam);
  } else {
    renderer.setRenderTarget(null); renderer.render(scene, camera);
  }
  updateLabels();
  updateHover();
  updateScale();
  ftimes.push(performance.now() - t0); if (ftimes.length > 60) ftimes.shift();
}

// ---------------- boot ----------------
async function boot() {
  try {
    META = await (await fetch(MEDIA + 'meta.json')).json(); step('heights');
    ({ x0: X0, y0: Y0, cell: CELL, nx: NX, ny: NY } = META);
    X1 = X0 + (NX - 1) * CELL; Y1 = Y0 + (NY - 1) * CELL;
    const hb = new Uint16Array(await bin(MEDIA + 'height.bin'));
    HGT = new Float32Array(hb.length); for (let k = 0; k < hb.length; k++) HGT[k] = hb[k] / 50 - 50;
    step('colours');
    const [colorTex, coastTex] = await Promise.all([loadTex(MEDIA + 'terrain.webp'), loadTex(MEDIA + 'coast.png')]);
    buildTerrain(colorTex); buildSea(coastTex); step('roads & buildings');
    const gl = new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder);
    const gltf = await new Promise((res, rej) => gl.load(MEDIA + 'island.glb', res, undefined, rej));
    addGLB(gltf); step('trees');
    buildInstances(await bin(MEDIA + 'instances.bin'));
    parseDetail(await bin(MEDIA + 'detail.bin')); hookFarTrees(); hookFarRoads(); step('town');
    try { buildTown(await (await fetch(MEDIA + 'town.json')).json()); } catch (e) { console.warn('town', e); }
    step('names');
    buildLabels(); buildRoadLabels();
    setupPost();
    updateSun(STYLE.hour);
    setView(readHash() || { x: -600, y: -300, dist: 21000, heading: 20, tilt: 48 });
    styleMeshes(scene);
    step('ready');
    $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 600);
    window.__ready = true;
    requestAnimationFrame(render);
  } catch (err) {
    console.error(err); loadMsg.textContent = 'Could not load: ' + err.message;
  }
}
boot();

window.__pan = { VEH, vSim, nearestRoad, setMode, setCam, spawnPlane, DETAIL, heightCubic, chunkGeometry: (c, L) => chunkGeometry(c, L), THREE, scene, camera, controls, renderer, chunks, culled, setView, getView, orbitTo, updateSun, setStyle, heightAt, toLatLon, fromLatLon, b2t, STYLE,
  perf: () => ({ ms: ftimes.reduce((a, b) => a + b, 0) / Math.max(1, ftimes.length), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: renderer.getPixelRatio() }) };
