<style>
  :root {
    color-scheme: dark;
    --ground: #0f0e0c;
    --panel: rgba(22, 20, 16, 0.80);
    --ink: #f2ede4;
    --muted: #a89f91;
    --line: rgba(242, 237, 228, 0.14);
    --oak: #cf9152;
    --oak-dim: rgba(207, 145, 82, 0.28);
    --ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --gut: 16px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #9cc3dc; color: var(--ink); font-family: var(--ui); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--oak); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .panel { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; }
  .eyebrow { font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  #info { position: fixed; left: var(--gut); top: calc(var(--gut) + var(--safe-t)); padding: 10px 14px 11px;
    display: grid; gap: 4px; pointer-events: none; max-width: calc(100% - 150px); z-index: 5; }
  #info .da { font: 700 20px/1.15 var(--ui); letter-spacing: -.01em; }
  #info .en { font-size: 12.5px; color: var(--muted); min-height: 15px; }
  #info .co { font: 400 11.5px/1.2 var(--mono); color: var(--oak); font-variant-numeric: tabular-nums; min-height: 14px; }

  #quick { position: fixed; right: var(--gut); top: calc(var(--gut) + var(--safe-t)); display: grid; gap: 2px; padding: 4px; z-index: 6; }
  #quick button { font: 500 12px/1 var(--ui); color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 9px 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; text-align: left; }
  #quick button i { font: 500 10px/1 var(--mono); font-style: normal; width: 16px; height: 16px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; }
  #quick button[aria-pressed="true"] { color: var(--ink); background: var(--oak-dim); }
  #quick button[aria-pressed="true"] i { border-color: var(--oak); color: var(--oak); }
  #quick #qTimeOut { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #timePop { position: fixed; right: calc(var(--gut) + 122px); top: calc(var(--gut) + var(--safe-t)); width: min(280px, calc(100vw - 160px)); padding: 12px 14px; display: grid; gap: 8px; z-index: 7; }
  #timePop input { width: 100%; accent-color: var(--oak); }
  #timePop .row { display: flex; justify-content: space-between; font: 400 11px/1 var(--mono); color: var(--muted); }

  #nav { position: fixed; right: var(--gut); bottom: calc(var(--gut) + var(--safe-b) + 18px); display: grid; gap: 2px; padding: 4px; z-index: 6; }
  #nav button { width: 40px; height: 40px; touch-action: none; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: 500 20px/1 var(--ui); cursor: pointer; display: grid; place-items: center; }
  #nav button:hover { background: var(--oak-dim); }
  #compassNeedle { transition: none; }

  #scale { position: fixed; left: var(--gut); bottom: calc(var(--gut) + var(--safe-b) + 18px); padding: 7px 10px 8px; z-index: 5; pointer-events: none; display: grid; gap: 5px; }
  #scale .bar { height: 5px; border: 1.5px solid var(--ink); border-top: 0; }
  #scale .lab { font: 500 11px/1 var(--mono); color: var(--ink); }
  #attrib { position: fixed; left: 0; right: 0; bottom: 0; padding: 3px 10px calc(3px + var(--safe-b)); font: 400 10px/1.3 var(--ui);
    color: rgba(20, 30, 40, .78); background: rgba(255, 255, 255, .55); z-index: 4; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #attrib a { color: inherit; }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px/1.1 var(--ui); color: #2b2620;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; will-change: transform; }
  .lb.place { font: 700 15px/1.1 var(--ui); letter-spacing: .01em; color: #1f1b16; }
  .lb.town { font: 800 19px/1.1 var(--ui); letter-spacing: .04em; text-transform: uppercase; color: #1f1b16; }
  .lb.locality { font: 500 11.5px/1.1 var(--ui); color: #3c352b; }
  .lb.peak { font: 600 11.5px/1.1 var(--ui); color: #4a3220; }
  .lb.peak::before { content: "▲ "; font-size: 9px; color: #6b4a2e; }
  .lb.peak small { font: 400 10px/1 var(--mono); color: #7a5a3c; margin-left: 4px; }
  .lb.water, .lb.bay { font: italic 500 11.5px/1.1 var(--ui); color: #12557a; text-shadow: 0 0 3px #e8f6ff, 0 0 3px #e8f6ff; }
  .lb.cape { font: italic 400 10.5px/1.1 var(--ui); color: #24425a; text-shadow: 0 0 3px #e8f6ff, 0 0 2px #e8f6ff; }
  .lb.poi { font: 500 11px/1.1 var(--ui); color: #5a3a1a; }
  .lb.poi::before { content: "● "; font-size: 8px; color: var(--oak); }
  .lb.road { font: 500 11px/1 var(--ui); color: #4a4540; letter-spacing: .01em; transform-origin: 50% 50%;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }
  .lb.road.main { font-weight: 600; color: #3a342d; }
  .lb.road.track { font: italic 400 10.5px/1 var(--ui); color: #6a5a45; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0f0e0c; z-index: 20; transition: opacity .5s; }
  #loading .box { display: grid; gap: 10px; text-align: center; }
  #loading .t { font: 700 26px/1 var(--ui); color: var(--ink); }
  #loading .p { font: 400 12px/1 var(--mono); color: var(--muted); }
  #loading .bar { width: 220px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #loading .bar div { height: 100%; width: 0; background: var(--oak); transition: width .2s; }

  @media (max-width: 560px) {
    :root { --gut: 10px; }
    #quick button span { display: none; }
    #timePop { right: calc(var(--gut) + 52px); }
    #info .da { font-size: 17px; }
  }

<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const $ = (id) => document.getElementById(id);
const MEDIA = $('stage').dataset.media;
const LITE = /[?&]lite\b/.test(location.search);
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 560;
const QUALITY = LITE ? 0.5 : (MOBILE ? 0.65 : 1);

// ---------------- coordinates ----------------
// Blender/local frame: x east, y north, z up (metres).  three: (x, z, -y).
const b2t = (x, y, z) => new THREE.Vector3(x, z, -y);
let META, NX, NY, X0, Y0, CELL, X1, Y1, HGT;
function heightAt(x, y) {
  let fx = (x - X0) / CELL, fy = (y - Y0) / CELL;
  if (fx < 0 || fy < 0 || fx > NX - 1.001 || fy > NY - 1.001) return -30;
  const j = fx | 0, i = fy | 0, tx = fx - j, ty = fy - i, k = i * NX + j;
  return (HGT[k] * (1 - tx) + HGT[k + 1] * tx) * (1 - ty) + (HGT[k + NX] * (1 - tx) + HGT[k + NX + 1] * tx) * ty;
}
// Catmull-Rom bicubic: smooth slopes for the 5 m near-camera terrain
function heightCubic(x, y) {
  const fx = (x - X0) / CELL, fy = (y - Y0) / CELL;
  if (fx < 1 || fy < 1 || fx > NX - 3 || fy > NY - 3) return heightAt(x, y);
  const j = Math.floor(fx), i = Math.floor(fy), tx = fx - j, ty = fy - i;
  const cr = (p0, p1, p2, p3, t) => p1 + 0.5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
  const row = (r) => { const k = r * NX + j; return cr(HGT[k - 1], HGT[k], HGT[k + 1], HGT[k + 2], tx); };
  const h = cr(row(i - 1), row(i), row(i + 1), row(i + 2), ty);
  const lo = Math.min(HGT[i * NX + j], HGT[i * NX + j + 1], HGT[(i + 1) * NX + j], HGT[(i + 1) * NX + j + 1]);
  const hi = Math.max(HGT[i * NX + j], HGT[i * NX + j + 1], HGT[(i + 1) * NX + j], HGT[(i + 1) * NX + j + 1]);
  return Math.min(Math.max(h, lo - 1.5), hi + 1.5);    // no wild overshoot at cliffs
}
const R_EARTH = 6378137, E2 = 0.00669438;
function toLatLon(x, y) {   // small-area inverse of the local transverse Mercator (sub-metre over the island)
  const lat0 = META.lat0 * Math.PI / 180, s = Math.sin(lat0);
  const M = R_EARTH * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5), N = R_EARTH / Math.sqrt(1 - E2 * s * s);
  const lat = META.lat0 + (y / M) * 180 / Math.PI - (x * x * Math.tan(lat0) / (2 * M * N)) * 180 / Math.PI;
  const lon = META.lon0 + (x / (N * Math.cos(lat * Math.PI / 180))) * 180 / Math.PI;
  return [lat, lon];
}
function fromLatLon(lat, lon) {
  const lat0 = META.lat0 * Math.PI / 180, s = Math.sin(lat0);
  const M = R_EARTH * (1 - E2) / Math.pow(1 - E2 * s * s, 1.5), N = R_EARTH / Math.sqrt(1 - E2 * s * s);
  const x = (lon - META.lon0) * Math.PI / 180 * N * Math.cos(lat * Math.PI / 180);
  const y = (lat - META.lat0) * Math.PI / 180 * M + x * x * Math.tan(lat0) / (2 * N);
  return [x, y];
}

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2) * (LITE ? 0.6 : 1));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.info.autoReset = false;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 2, 400000);
const controls = new MapControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.screenSpacePanning = false;
controls.zoomToCursor = true;
controls.minDistance = 40; controls.maxDistance = 45000;
controls.maxPolarAngle = THREE.MathUtils.degToRad(80);
controls.zoomSpeed = 1.4;
controls.rotateSpeed = 0.6;
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

const STYLE = { cel: true, labels: true, trees: true, buildings: true, hour: 17 };
const FOG = new THREE.Color('#cfe2ec');
scene.fog = new THREE.FogExp2(FOG, 0.0000115);

// sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#4f9ad6') }, hor: { value: FOG.clone() }, sun: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color('#fff4dc') } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); gl_Position.z = gl_Position.w; }',
  fragmentShader: `uniform vec3 top, hor, sun, sunCol; varying vec3 vD;
    void main(){ float h = max(vD.y, 0.0); vec3 c = mix(hor, top, pow(h, 0.55));
      float s = max(dot(normalize(vD), normalize(sun)), 0.0); c += sunCol * (pow(s, 600.0) * 2.0 + pow(s, 12.0) * 0.18);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000000, 32, 16), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

const hemi = new THREE.HemisphereLight('#dbeeff', '#8a7456', 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d6', 3.0);
sun.castShadow = true;
const SHADOW_RES = LITE ? 1024 : (MOBILE ? 2048 : 4096);
sun.shadow.mapSize.set(SHADOW_RES, SHADOW_RES);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
let sunDir = new THREE.Vector3(0.5, 0.5, 0.5);

// toon ramp: three hard bands
const RAMP = (() => {
  const d = new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 215, 215, 215, 255, 255, 255, 255, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();

// ---------------- materials ----------------
const MATDEF = {
  Terrain: { color: '#ffffff' },
  RoadMain: { color: '#5f5c58', pull: [0.7, 0.0028] },
  RoadMinor: { color: '#7d776f', pull: [0.6, 0.0025] },
  RoadPaved: { color: '#aaa69d', pull: [0.6, 0.0025] },
  Track: { color: '#a8906e', pull: [0.5, 0.0022] },
  Path: { color: '#bba47f', pull: [0.5, 0.0022] },
  Runway: { color: '#57595c', pull: [0.8, 0.0028] },
  Lava: { color: '#4d4743', pull: [0, 0.0006] },
  Plaster: { color: '#f0eadf', pull: [0, 0.0006] },
  Roof: { color: '#f7f4ee', pull: [0, 0.0006] },
  Glasshouse: { color: '#d3e0db', pull: [0, 0.0006] },
  Ruin: { color: '#5e564e', pull: [0, 0.0006] },
  Church: { color: '#f3e8d2', pull: [0, 0.0006] },
  Concrete: { color: '#bdb8ae' },
  Lake: { color: '#5cc2b2', pull: [0.05, 0.0002], rough: 0.25 },   // tiny pull: the shore is only ~1 m above the water
  Tree: { color: '#ffffff', vertexColors: true, pull: [0, 0.0006] },
};
const ALLMATS = [];
function makeMat(key, extra = {}) {
  const d = MATDEF[key];
  const pair = {};
  for (const cel of [true, false]) {
    const o = { color: new THREE.Color(d.color), vertexColors: !!d.vertexColors, ...extra };
    const m = cel ? new THREE.MeshToonMaterial({ ...o, gradientMap: RAMP }) : new THREE.MeshStandardMaterial({ ...o, roughness: d.rough ?? 0.92, metalness: 0 });
    if (d.pull) {
      m.userData.pull = d.pull;
      m.onBeforeCompile = (sh) => {
        sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
          { float l_ = length(mvPosition.xyz); mvPosition.xyz *= max(0.05, 1.0 - (${d.pull[0].toFixed(4)} + ${d.pull[1].toFixed(5)} * l_) / l_);
            gl_Position = projectionMatrix * mvPosition; }`);
      };
      m.customProgramCacheKey = () => 'pull' + d.pull.join('_');
    }
    pair[cel ? 'cel' : 'std'] = m;
  }
  ALLMATS.push(pair);
  return pair;
}
const MAT = {};
for (const k of Object.keys(MATDEF)) if (k !== 'Terrain') MAT[k] = makeMat(k);
function styleMeshes(root) {
  root.traverse((o) => { if (o.isMesh && o.userData.mats) o.material = o.userData.mats[STYLE.cel ? 'cel' : 'std']; });
}

// ---------------- loading ----------------
const loadBar = $('loadBar'), loadMsg = $('loadMsg');
let loaded = 0; const TOTAL = 6;
function step(msg) { loaded++; loadBar.style.width = (loaded / TOTAL * 100) + '%'; loadMsg.textContent = msg; }
async function bin(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
  let b = new Uint8Array(await r.arrayBuffer());
  if (b[0] === 0x1f && b[1] === 0x8b) {
    const ds = new DecompressionStream('gzip');
    b = new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer());
  }
  return b.buffer;
}
const texLoader = new THREE.TextureLoader();
const loadTex = (u) => new Promise((res, rej) => texLoader.load(u, res, undefined, rej));

// ---------------- terrain (chunked heightmap, 4 LODs) ----------------
const terrain = new THREE.Group(); scene.add(terrain);
const CH = 100, STEPS = [0.5, 1, 2, 4, 8];   // L0 = 5 m (bicubic, near the camera only), then 10/20/40/80 m
let LODH = [];   // box-filtered heights per level
const chunks = [];
let terrainMats;
function boxFilter(src, r) {
  if (r <= 1) return src;
  const out = new Float32Array(src.length), tmp = new Float32Array(src.length), h = Math.floor(r / 2);
  for (let i = 0; i < NY; i++) {
    for (let j = 0; j < NX; j++) {
      let s = 0, n = 0;
      for (let k = -h; k <= h; k++) { const jj = j + k; if (jj >= 0 && jj < NX) { s += src[i * NX + jj]; n++; } }
      tmp[i * NX + j] = s / n;
    }
  }
  for (let j = 0; j < NX; j++) {
    for (let i = 0; i < NY; i++) {
      let s = 0, n = 0;
      for (let k = -h; k <= h; k++) { const ii = i + k; if (ii >= 0 && ii < NY) { s += tmp[ii * NX + j]; n++; } }
      out[i * NX + j] = s / n;
    }
  }
  return out;
}
function chunkGeometry(c, L) {
  const st = STEPS[L], src = LODH[L];
  const ii = [], jj = [];
  for (let i = c.i0; i < c.i1 - 1e-6; i += st) ii.push(i); ii.push(c.i1);
  for (let j = c.j0; j < c.j1 - 1e-6; j += st) jj.push(j); jj.push(c.j1);
  const h = ii.length, w = jj.length;
  const nV = h * w, ring = 2 * (h + w) - 4;
  const pos = new Float32Array((nV + ring) * 3), uv = new Float32Array((nV + ring) * 2);
  const zat = (i, j) => {
    const edge = i === c.i0 || i === c.i1 || j === c.j0 || j === c.j1;
    if (Number.isInteger(i) && Number.isInteger(j)) return edge ? HGT[i * NX + j] : src[i * NX + j];
    const x = X0 + j * CELL, y = Y0 + i * CELL;
    return edge ? heightAt(x, y) : heightCubic(x, y);   // borders stay linear so they meet the 10 m neighbours
  };
  let p = 0;
  for (let a = 0; a < h; a++) for (let b = 0; b < w; b++) {
    const i = ii[a], j = jj[b], x = X0 + j * CELL, y = Y0 + i * CELL;
    pos[p * 3] = x; pos[p * 3 + 1] = zat(i, j); pos[p * 3 + 2] = -y;
    uv[p * 2] = (x - X0) / (X1 - X0); uv[p * 2 + 1] = (y - Y0) / (Y1 - Y0); p++;
  }

// ---------------- near detail: Wind-Waker-style close-ups ----------------
// Built per 250 m tile around what you look at when zoomed in (< 1 km), dropped again when you leave:
//  - roads redrawn with their real surface: asphalt (worn edges, dashed centre line on main roads), dirt (ruts + grass
//    strip), cement lanes (joints); lava-stone walls along both sides of rural roads, with gaps for gates
//  - chunky dry-stone walls (field edges, OSM walls, giardini panteschi, terraces along the contours of farmed slopes)
//  - puffy toon vegetation: maritime pines (replacing the far cones in place), macchia, olives, alberello vines,
//    prickly pears by the houses, grass tufts, capers on the walls, a citrus in each pantesco garden.

// ---------------- view helpers ----------------

// rotation: right-drag or shift/ctrl/cmd + drag on the map (OrbitControls), two-finger drag on touch,
// the ⟲ ⟳ buttons (hold to keep turning), Q/E and R/F keys, or dragging the compass
function nudge(dh, dt) {

function holdRepeat(id, fn) {

holdRepeat('rotR', () => nudge(1.5, 0));
{
  const nb = $('north'); let drag = null, moved = false;
